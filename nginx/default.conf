server {
    listen 80;
    # CHANGE THIS to your actual DuckDNS domain
    server_name <your-subdomain>.duckdns.org;

    # Common Headers & WebSocket Support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Jellyfin (Root)
    location / {
        proxy_pass http://jellyfin:8096;
        proxy_buffering off;
    }

    # Jellyseerr (Subfolder Workaround)
    location ^~ /requests {
        set $app 'requests';
        rewrite ^/requests/?(.*)$ /$1 break;
        proxy_pass http://jellyseerr:5055; # NO trailing slash here
        
        proxy_redirect ^ /$app;
        proxy_redirect /setup /$app/setup;
        proxy_redirect /login /$app/login;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'href="/"' 'href="/$app"';
        sub_filter 'href="/login"' 'href="/$app/login"';
        sub_filter 'href:"/"' 'href:"/$app"';
        sub_filter '\/_next' '\/$app\/_next';
        sub_filter '/_next' '/$app/_next';
        sub_filter '/api/v1' '/$app/api/v1';
        sub_filter '/login/plex/loading' '/$app/login/plex/loading';
        sub_filter '/images/' '/$app/images/';
        sub_filter '/imageproxy/' '/$app/imageproxy/';
        sub_filter '/avatarproxy/' '/$app/avatarproxy/';
        sub_filter '/android-' '/$app/android-';
        sub_filter '/apple-' '/$app/apple-';
        sub_filter '/favicon' '/$app/favicon';
        sub_filter '/logo_' '/$app/logo_';
        sub_filter '/site.webmanifest' '/$app/site.webmanifest';
        proxy_buffering off;
    }

    # Prowlarr (Requires URL Base set in Prowlarr settings)
    location /prowlarr {
        proxy_pass http://prowlarr:9696;
        proxy_buffering off;
    }

    # Radarr (Requires URL Base set in Radarr settings)
    location /radarr {
        proxy_pass http://radarr:7878;
        proxy_buffering off;
    }

    # Sonarr (Requires URL Base set in Sonarr settings)
    location /sonarr {
        proxy_pass http://sonarr:8989;
        proxy_buffering off;
    }

    # qBittorrent (Fixes authentication loops)
    location = /qbittorrent {
        return 301 /qbittorrent/;
    }
    location /qbittorrent/ {
        proxy_pass http://gluetun:8080/; # Trailing slash is REQUIRED here
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # This rewrites the session cookie path to fix login loops
        proxy_cookie_path / "/qbittorrent/; SameSite=Lax"; 
        proxy_buffering off;
    }
}